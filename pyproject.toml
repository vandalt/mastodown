[project]
name = "mastodown"
dynamic = ["version"]
description = "Tiny Python MAST Client"
readme = "README.md"
authors = [
    { name = "Thomas Vandal", email = "thomas.vandal@umontreal.ca" }
]
requires-python = ">=3.11"
dependencies = ["astroquery", "pandas"]

[dependency-groups]
dev = [
    "ipython",
    {include-group = "docs"},
    {include-group = "test"},
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
]
test = [
    "pytest",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call the live MAST API",
]

[project.scripts]
mastodown = "mastodown.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mastodown/_version.py"
